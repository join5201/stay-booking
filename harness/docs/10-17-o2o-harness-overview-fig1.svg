.h{font-size:14px;font-weight:500;fill:#1F2328}
.r{font-size:12px;fill:#57606A}
.bw{fill:#FFFFFF;stroke:#1F2328;stroke-width:1}
.bg{fill:#EFF1F3;stroke:#1F2328;stroke-width:1}
.bk{fill:#1F2328;stroke:#1F2328;stroke-width:1}
.tk{font-size:14px;font-weight:500;fill:#1F2328}
.tw{font-size:14px;font-weight:500;fill:#FFFFFF}
.sk{font-size:12px;fill:#57606A}
.sw{font-size:12px;fill:#B8BFC7}
.ln{stroke:#1F2328;stroke-width:1;fill:none}
</style>
<defs><marker id="a" viewBox="0 0 8 8" refX="7.5" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0.5 L7.5,4 L0,7.5 z" fill="#1F2328"/></marker></defs>
