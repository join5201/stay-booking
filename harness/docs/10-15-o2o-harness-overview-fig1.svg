<svg xmlns="http://www.w3.org/2000/svg" width="680" height="676" viewBox="0 0 680 676" role="img" aria-labelledby="t1 d1">
<title id="t1">O2O 하네스 한 라운드의 아홉 단계</title>
<desc id="d1">사람, Claude Code, Codex 새 작업 세 레인으로 나눈 흐름도. 계약, 생성, G1, 평가 A와 B, 결정, G2, 반영, 최종 순서로 진행하고 반영에서 평가로 돌아가는 재평가 점선이 한 번 있다.</desc>
