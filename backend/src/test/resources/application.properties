# 테스트 설정. 근거: 작업 계약 task-S9-catalog 9절 테스트 DB 행.
#
# 키 이름은 2026-09-08에 Spring Boot 4.1.1 jar의 spring-configuration-metadata.json에서 확인했다.
# spring.datasource.* 는 spring-boot-jdbc-4.1.1, spring.jpa.hibernate.ddl-auto 는 spring-boot-hibernate-4.1.1.
# 기억으로 적지 않는다(F15).
#
# 비밀번호는 여기 적지 않는다. backend/.env의 환경변수를 build.gradle이 테스트 태스크에 넘긴다.
#
# 실패 시 출력 예시
#   Could not resolve placeholder 'O2O_MYSQL_USER'
#     backend/.env가 없거나 그 줄이 비어 있다. backend/README.md 2절
#   Communications link failure
#     컨테이너가 안 떠 있다. docker compose -f backend/docker-compose.yml up -d

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/o2o_catalog_test
spring.datasource.username=${O2O_MYSQL_USER}
spring.datasource.password=${O2O_MYSQL_PASSWORD}

# create-drop을 쓰는 이유: 이 DB는 테스트 전용이고 계약 9절이 초기화 허용 범위를
# o2o_catalog_test 안으로 한정한다. 스키마 이력 관리 도구는 4단계에서 판정한다.
spring.jpa.hibernate.ddl-auto=create-drop

# 운영 설정과 같은 값을 테스트에도 건다. 테스트만 관대하면 C9가 실제 동작을 못 잰다
spring.jackson.deserialization.fail-on-unknown-properties=true

# 개발 프로파일. 운영 설정과 같은 값이다. 테스트 컨텍스트도 기본으로 dev라 행위자 헤더와 INTERNAL-01이
# 산다. T30 테스트만 @ActiveProfiles로 다른 프로파일을 켠 컨텍스트에서 둘이 꺼지는 것을 본다
# (task-S9-payment 7절 D-3).
spring.profiles.active=dev

# 풀 기본 격리 수준. 운영 설정과 같은 값이다. 잠금 뒤 읽기가 앞 커밋을 봐야 하는 경로(Y22)와 바깥
# 트랜잭션이 결제 앱 서비스를 감싸는 경로(예약 2차)를 같은 규칙으로 돌린다(task-S9-payment 9단계 개정 1 보강).
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# TTL 만료 스케줄러를 테스트에서 끈다. 백그라운드 스캔이 테스트가 놓은 만료 시각 지난 HELD를 먼저
# 집어 가지 않게 하기 위해서다. T1 테스트는 스캔 메서드를 직접 부른다(task-S9-booking-lifecycle 7절 D-3 가).
o2o.booking.expire-scheduler.enabled=false
