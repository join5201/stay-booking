spring.application.name=backend

# 11 공통 요청과 응답 규칙: 요청의 정의되지 않은 필드는 400이다.
# 키 이름은 spring-boot-jackson-4.1.1의 설정 메타데이터에서 확인했다. 값 타입이
# Map<tools.jackson.databind.DeserializationFeature, Boolean>이고 그 열거에
# FAIL_ON_UNKNOWN_PROPERTIES가 있는 것을 javap으로 확인했다. 8-1절 C9가 이 설정을 검사한다.
spring.jackson.deserialization.fail-on-unknown-properties=true
