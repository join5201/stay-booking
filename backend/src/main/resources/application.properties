spring.application.name=backend

# 11 공통 요청과 응답 규칙: 요청의 정의되지 않은 필드는 400이다.
# 키 이름은 spring-boot-jackson-4.1.1의 설정 메타데이터에서 확인했다. 값 타입이
# Map<tools.jackson.databind.DeserializationFeature, Boolean>이고 그 열거에
# FAIL_ON_UNKNOWN_PROPERTIES가 있는 것을 javap으로 확인했다. 8-1절 C9가 이 설정을 검사한다.
spring.jackson.deserialization.fail-on-unknown-properties=true

# DB 접속. 설계 근거: 계약 9절 테스트 DB 행, plan-step3.md 4절.
# 키 이름은 Spring Boot 4.1.1 jar의 설정 메타데이터에서 확인했다.
# spring.datasource.* 는 spring-boot-jdbc-4.1.1, ddl-auto는 spring-boot-hibernate-4.1.1.
#
# 값은 backend/.env의 환경변수에서 온다. 비밀번호를 이 파일에 적지 않는다.
# 앱을 직접 띄울 때는 그 값이 셸 환경에 있어야 한다. build.gradle의 bootRun이
# backend/.env를 읽어 넘기므로 gradlew bootRun으로 띄우면 따로 export할 필요가 없다.
#
# 실패 시 출력 예시
#   Failed to configure a DataSource: 'url' attribute is not specified
#     이 절이 통째로 없거나 환경변수가 안 넘어왔다. backend/README.md 2절과 3절
#   Communications link failure
#     컨테이너가 안 떠 있다. docker compose -f backend/docker-compose.yml up -d
spring.datasource.url=jdbc:mysql://127.0.0.1:3307/o2o_catalog_test
spring.datasource.username=${O2O_MYSQL_USER}
spring.datasource.password=${O2O_MYSQL_PASSWORD}

# 테스트는 create-drop이고 여기는 update다. 둘의 대상 DB는 같다(plan-step3.md 4절).
# 테스트는 매번 빈 상태에서 시작해야 하고, 직접 띄운 앱은 재시작마다 데이터가 사라지면
# 손으로 확인할 수가 없다. 스키마 이력 관리 도구 도입은 아직 판정하지 않았다(10-6 41행).
spring.jpa.hibernate.ddl-auto=update

# 개발 프로파일. 설계 근거: 11 인증과 접근 제어 셋째 문단(개발 프로파일 밖에서는 X-Dev-Actor-Id
# 어댑터와 /internal 경로를 비활성화한다), task-S9-payment 7절 D-3(T30). 이 줄이 있어서 bootRun이
# 기본으로 dev이고 ActorResolver와 INTERNAL-01 컨트롤러가 산다. 키는 spring-boot-4.1.1의 설정
# 메타데이터에서 확인했다. 배포가 범위에 들어올 때 이 줄을 빼거나 다른 프로파일로 덮는다.
spring.profiles.active=dev

# 풀 기본 격리 수준. 설계 근거: task-S9-payment 9단계 개정 1 보강(2026-09-13 사용자 지시 그대로 반영).
# MySQL 기본 REPEATABLE READ는 트랜잭션의 첫 일반 읽기에서 스냅샷을 고정한다. 루트만 잠그는 조회
# (for update of 루트)가 조인한 자식 표를 잠금 없이 읽으면 잠금 전에 스냅샷이 굳어 잠금 뒤 읽기가
# 앞 커밋을 못 본다(Y22). 앱 서비스의 @Transactional 격리 수준 지정은 새 트랜잭션에만 걸리고 바깥
# 트랜잭션에 합류하면 무시되므로 풀 기본값으로 둔다. 키는 HikariCP 7.0.2의 transactionIsolation이고
# Spring Boot 4.1.1이 spring.datasource.hikari.*를 그 빈에 묶는 것을 설정 메타데이터에서 확인했다.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED
