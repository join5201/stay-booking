# PR과 main의 자동 검사 (이슈 211)
#
# 왜 이 파일이 필요한가: 백엔드 테스트와 하네스 검사기는 사람이나 AI가 기억해서 돌릴 때만 돌았다
# (CLAUDE.md 4-1 4단계). GitHub가 PR마다 같은 명령을 대신 돌려 결과를 PR에 붙인다.
# 세션의 턴 끝 동작은 바꾸지 않는다(harness/docs/10-14 8-5절). LLM을 부르지 않는다(N1과 무관).
#
# 작업 둘
#   backend  JDK 21과 mysql:9.7.2 서비스로 gradlew test. 이미지와 포트(3307)와 DB 이름은
#            backend/docker-compose.yml과 같다. DB 계정은 이 작업 안에서만 사는 일회용 값이라
#            비밀이 아니다. JUnit XML은 성공과 실패 모두 올린다.
#   harness  Windows와 Node 22로 검사기 테스트와 게이트 넷(settings, union, sweep, numbers).
#            검사기가 Windows 경로를 전제로 쓰여 리눅스가 아니라 Windows에서 돌린다.
#
# 로컬에서 같은 것을 돌리는 예시
#   docker compose -f backend/docker-compose.yml up -d
#   cd backend && ./gradlew test
#   node --test harness/tools/tests/check.test.mjs
#   node harness/tools/check.mjs settings .claude/settings.json
#   node harness/tools/check.mjs union .gitattributes
#   node harness/tools/check.mjs sweep harness/docs --type doc
#   node harness/tools/check.mjs numbers harness/docs
#
# 실패 시 출력 예시
#   Communications link failure
#     MySQL 서비스가 아직 안 떴거나 포트가 다르다. services.mysql의 ports와 health 옵션을 본다
#   Could not resolve placeholder 'O2O_MYSQL_USER'
#     backend 작업의 env가 테스트 JVM까지 안 넘어왔다. build.gradle test 태스크의 environment를 본다
#   FAIL sweep harness/docs
#     하네스 문서가 g1을 통과하지 못했다. 같은 명령을 로컬에서 돌려 실패 행을 본다
#
# 액션은 커밋 SHA로 고정하고 옆에 판 번호를 적는다. 2026-09-25 각 저장소의 latest 릴리스다.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# 같은 PR에 새 커밋이 오면 앞 실행을 멈춘다. main은 병합마다 끝까지 돌린다
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      O2O_MYSQL_USER: o2o_ci
      O2O_MYSQL_PASSWORD: o2o_ci_only
    services:
      mysql:
        image: mysql:9.7.2
        ports:
          - 3307:3306
        env:
          MYSQL_ROOT_PASSWORD: o2o_ci_root
          MYSQL_DATABASE: o2o_catalog_test
          MYSQL_USER: o2o_ci
          MYSQL_PASSWORD: o2o_ci_only
        # 127.0.0.1로 물어야 초기화 중 임시 서버(소켓만 연다)를 건강하다고 잘못 보지 않는다
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      # gradlew가 실행 권한 없이(100644) 추적되고 있어 bash로 부른다
      - name: gradlew test
        run: bash ./gradlew test --no-daemon
      - name: JUnit XML 올리기
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-results
          path: backend/build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 14

  harness:
    name: harness
    # 검사기는 Windows 경로(C:/...)를 전제로 쓰였다. 리눅스에서는 /tmp 같은 절대경로를 경로로 읽지
    # 못해 check.test.mjs 15건이 실패했다(첫 실행 run 36095041494). 개발 환경과 같은 Windows에서 돌린다
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # numbers는 기본으로 origin/main과 대조한다. 얕은 체크아웃에는 그 ref가 없다
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: 검사기 테스트
        # 테스트가 임시 폴더의 파일을 저장소 기준 상대경로로 적는다. 작업 폴더와 같은 드라이브에 둔다
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: node --test harness/tools/tests/check.test.mjs
      - name: 권한 설정의 Bash와 PowerShell 짝
        run: node harness/tools/check.mjs settings .claude/settings.json
      - name: union 병합 흔적
        run: node harness/tools/check.mjs union .gitattributes
      - name: 하네스 문서 g1
        run: node harness/tools/check.mjs sweep harness/docs --type doc
      - name: 문서 번호 겹침(origin/main과 대조)
        run: node harness/tools/check.mjs numbers harness/docs
