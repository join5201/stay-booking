# CodeRabbit 리뷰 설정
#
# 무엇을 하는 파일인가: PR이 열리면 CodeRabbit 봇이 이 파일을 읽고 그 규칙으로 리뷰한다.
# 이 파일이 없으면 영어 기본값으로 리뷰하고 CLAUDE.md의 조항 번호를 인용하지 못한다.
#
# 스키마: https://coderabbit.ai/integrations/schema.v2.json
#   공식 문서에 적힌 schema.json은 404다. v2 주소를 쓴다. 2026-09-10 확인.
#
# 검증 실행 예시와 실패 시 출력 예시: harness/docs/10-16-o2o-harness-coderabbit.md 6절
#
# 기본값과 같은 항목은 적지 않는다. 여기 있는 것은 전부 기본값과 다르거나
# 사람이 자주 돌릴 손잡이다. 어느 쪽인지는 각 항목의 주석에 적는다.
#
# 최초 작성: 2026-09-10
# 최종 갱신: 2026-09-10

# 기본값 en-US. 리뷰 코멘트를 한국어로 낸다(CLAUDE.md W1)
language: "ko-KR"

# 기본값 빈 문자열. 250자 제한이다
tone_instructions: |-
  한국어로 답한다. 지적은 짧게 쓰고 근거 파일과 줄을 먼저 적는다.
  제목 밖 볼드체와 줄표와 가운뎃점을 쓰지 않는다. 인사말과 칭찬을 생략한다.
  확실하지 않으면 확실하지 않다고 적는다.

reviews:
  # 손잡이. quiet는 중요한 것만, chill은 중간, assertive는 사소한 것까지 낸다.
  # 소음이 많으면 quiet로, 놓치는 것이 많으면 assertive로 바꾼다
  profile: "chill"

  # 기본값 false. false면 봇이 PR 본문을 고쳐 요약을 넣는다.
  # PR 본문은 .github/PULL_REQUEST_TEMPLATE.md의 자리다. 봇이 덮지 않게 코멘트로 보낸다
  high_level_summary_in_walkthrough: true

  # 기본값 true. 1인 저장소라 제안할 리뷰어가 없다
  suggested_reviewers: false

  # 기본값 true. 리뷰 진행 중에 운세 문구를 붙인다. 문체 규칙이 장식을 금한다(W6)
  in_progress_fortune: false

  # 기본값 빈 배열. 느낌표로 시작하면 제외다.
  # 주의: 이 패턴은 봇이 저장소를 받아올 때도 쓰인다. 제외한 자리는 아예 받지 않는다
  path_filters:
    # 원본 사본. 모델도 못 고치는 자리다(CLAUDE.md 3-1)
    - "!harness/project-sync/**"
    # 평가자 리포트 원문. 원문 그대로 두는 파일이라 지적할 자리가 아니다.
    # 폴더가 아니라 파일 이름으로 막는다. README.md는 색인이라 리뷰 대상이다
    - "!harness/reviews/task-*.md"
    - "!harness/reviews/harness-*.md"
    # 추가 전용 기록 셋. 같은 형식 지적이 매 PR마다 반복된다.
    # 이 폴더의 기록 파일은 이 셋으로 고정이다(CLAUDE.md 3절)
    - "!harness/state/progress.md"
    - "!harness/state/troubleshooting.md"
    - "!harness/state/knowledge.md"
    # 생성 후보와 형식 보정 이력. 반영판은 document/로 가므로 거기서 본다.
    # 하위 폴더 안쪽만 막는다. 맨 위의 README.md는 남긴다
    - "!harness/out/*/**"
    # 빌드 도구가 만든 파일
    - "!backend/gradle/wrapper/**"
    - "!backend/gradlew"
    - "!backend/gradlew.bat"
    # 바이너리
    - "!**/*.pdf"
    - "!**/*.png"
    - "!**/*.jpg"

  # 기본값 빈 배열. 비워 두면 봇이 과거 PR만 보고 라벨을 짐작한다.
  # 붙이지는 않고 제안만 한다(auto_apply_labels 기본값 false)
  labeling_instructions:
    - label: "harness"
      instructions: "harness/ 아래가 바뀐 PR에 붙인다. 검사기, 양식, 기록 규칙, 작업 계약이 여기 든다."
    - label: "documentation"
      instructions: "document/ 아래 또는 README.md가 바뀐 PR에 붙인다."
    - label: "defect"
      instructions: "규칙과 어긋나 있던 동작을 되돌린 PR에 붙인다. 없던 것을 새로 넣었으면 붙이지 않는다."
    - label: "task"
      instructions: "하네스 한 바퀴를 도는 작업 PR에 붙인다. task-S로 시작하는 계약 파일이 함께 바뀐다."
    - label: "review"
      instructions: "harness/decisions/ 아래가 바뀐 PR에 붙인다. 평가 지적의 반영이다."
    - label: "enhancement"
      instructions: "없던 것을 새로 넣은 PR에 붙인다."

  # 기본값 빈 배열. 경로별로 무엇을 볼지 알려 준다
  path_instructions:
    - path: "**/*.md"
      instructions: |-
        문체 규칙의 정본은 CLAUDE.md 2절이다. 위반을 지적할 때 조항 번호를 함께 적는다.
        W1 한국어로 쓴다.
        W2 제목 외에는 볼드체를 쓰지 않는다.
        W3 줄표와 가운뎃점을 쓰지 않는다.
        W4 인용부호는 최소화한다.
        W6 불필요한 반복 설명을 생략한다.
        D3 표로 정리 가능한 것은 산문 대신 표로 낸다.
        D4 문서 머리에 최초 작성일과 최종 갱신일이 있어야 한다.
           바뀐 절은 제목 옆에 반영 날짜를 적는다.
        문서가 다른 파일을 가리킬 때 경로는 저장소 루트 기준 상대경로로 적는다.
        절대경로를 적으면 다른 worktree의 파일을 가리킨다(harness/docs/10-10 2절).
        본문이 한국어인 것은 정상이다. 영어로 고치라는 지적을 하지 않는다.
        영어 문법이나 마크다운 서식 취향으로 지적하지 않는다.

    - path: "harness/**/*.md"
      instructions: |-
        파일명 규약의 정본은 CLAUDE.md 3절이다.
        문서 Task는 task-S{Step}.md, 기능별 개발 Task는 task-S{Step}-{기능키}.md,
        결정표는 task-S{Step}-R{라운드}.md, 평가 리포트는 task-S{Step}-R{라운드}-{A 또는 B}.md.
        지적 ID는 S{Step}-R{라운드}-{A 또는 B}-{원본 번호 2자리}.
        harness/docs/에 문서를 새로 넣었으면 harness/docs/README.md의 파일 표에 행이 함께 늘어야 한다.
        문서 번호가 기존 파일과 겹치면 지적한다.
        진행 기록의 결과 칸은 pending, drafted, reviewed, applied, done 여섯 중 하나다.
        done은 사용자 승인 행에서만 쓴다(CLAUDE.md N5).

    - path: "harness/tools/**/*.mjs"
      instructions: |-
        검사 스크립트다. 통과 여부가 이 저장소의 게이트다.
        D5에 따라 파일 머리 주석에 실행 예시와 실패 시 출력 예시가 있어야 한다.
        경로는 저장소 루트 기준 상대경로로 푼다. 루트는 스크립트 위치에서 유도한다.
        절대경로를 그대로 쓰면 다른 worktree의 파일을 해시한다(harness/docs/10-10 2절).
        검사가 판단하지 못하는 입력을 만나면 통과가 아니라 실패를 낸다.
        조용한 오답이 실패보다 나쁘다.
        검사기가 진행 기록에 done을 쓰면 지적한다.

    - path: "backend/src/main/java/**/*.java"
      instructions: |-
        DDD 계층 규약을 본다. 검증 책임 위치의 정본은 document/06-4-o2o-contracts.md 1-4절 표다.
        형식 검증은 api 패키지가, 컨텍스트를 넘는 선행조건은 application 패키지가,
        규칙 검증은 domain 패키지가 한다. 같은 검증을 두 층에서 되풀이하면 지적한다.
        domain 패키지는 다른 층을 참조하지 않는다. JPA 애노테이션만 예외다.
        document/11-o2o-api-spec.md에 없는 경로를 새로 만들면 지적한다.
        도메인이 강제하는 불변식은 document/06-2-o2o-aggregates.md와
        document/06-4-o2o-contracts.md의 불변식표에 있는 것만이다.
        설계 문서에 근거가 없는 규칙을 코드가 새로 정하면 지적한다.

    - path: "backend/src/test/java/**/*.java"
      instructions: |-
        테스트는 작업 계약의 테스트 ID와 이어져야 한다. C2와 P07 같은 ID다.
        클래스나 메서드 주석에 그 ID와 설계 근거 절이 없으면 지적한다.
        계약에 없는 동작을 테스트가 새로 정의하면 지적한다.
        성공 경로만 있고 계약에 적힌 실패 경로가 빠졌으면 지적한다.

  tools:
    # 기본값 true. 이 저장소는 문서 형식을 CLAUDE.md 2절과 check.mjs g1으로 잰다.
    # 서식 권위가 둘이면 어느 쪽을 어겼는지 가릴 수 없다
    markdownlint:
      enabled: false
    # 기본값 true. 한국어 본문에 영어 문법 검사를 걸면 소음만 나온다
    languagetool:
      enabled: false

chat:
  # 기본값 true. 아스키 아트. 장식을 뺀다
  art: false

knowledge_base:
  learnings:
    # 기본값 auto. auto는 공개 저장소에서 local, 비공개에서 global로 풀린다.
    # 공개 여부가 바뀌어도 학습이 조직 전체로 새지 않게 못박는다
    scope: "local"
  code_guidelines:
    enabled: true
    # 주의: 배열을 적으면 기본 목록을 대체한다.
    # 그래서 기본 목록에 이미 있는 CLAUDE.md와 AGENTS.md를 여기 다시 적는다
    filePatterns:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "harness/prompts/07-o2o-ptcf-prompt.v3.md"
      - "harness/prompts/eval-criteria-code.md"
      - "harness/prompts/eval-criteria-ddd.md"
