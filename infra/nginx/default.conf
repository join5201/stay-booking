# 앞문 Nginx (이슈 241). PC에서 80으로 받는다. 길 나누기는 o2o-proxy.conf에 있다.
# 서버는 이 파일 대신 server.conf를 쓴다(https).
#
# 확인
#   docker compose --env-file backend/.env exec nginx nginx -t
#   curl -i http://localhost/api/v1/properties
#
# 실패 시 출력 예시
#   502 Bad Gateway
#     backend나 frontend가 아직 안 떴다. docker compose ps로 healthy인지 본다
#   429 Too Many Requests
#     한 주소에서 /api를 초당 10건 넘게, 몰아서 20건 넘게 보냈다. 의도한 동작이다

# 한 주소당 /api 초당 10건. 상태 저장에 10MB(약 16만 주소)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    include /etc/nginx/o2o/o2o-proxy.conf;
}
