# 앞문 Nginx (이슈 241). 80으로 받아 /api는 백엔드, 나머지는 프론트로 넘긴다.
# /actuator 같은 백엔드의 다른 경로는 밖으로 열지 않는다.
#
# 확인
#   docker compose --env-file backend/.env exec nginx nginx -t
#   curl -i http://localhost/api/v1/properties
#
# 실패 시 출력 예시
#   502 Bad Gateway
#     backend나 frontend가 아직 안 떴다. docker compose ps로 healthy인지 본다
#   429 Too Many Requests
#     한 주소에서 /api를 초당 10건 넘게, 몰아서 20건 넘게 보냈다. 의도한 동작이다

# 한 주소당 /api 초당 10건. 상태 저장에 10MB(약 16만 주소)
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;

    # Docker 내장 DNS. 컨테이너를 다시 만들면 주소가 바뀌므로 10초마다 다시 묻는다.
    # proxy_pass에 변수를 써야 이 resolver를 쓴다. 이름을 그대로 쓰면 기동 때 한 번만 풀고 굳는다
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        limit_req zone=api burst=20 nodelay;
        limit_req_status 429;

        set $backend http://backend:8080;
        proxy_pass $backend;
    }

    location / {
        set $frontend http://frontend:3000;
        proxy_pass $frontend;
    }
}
