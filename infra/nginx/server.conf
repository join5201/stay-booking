# 서버의 앞문 Nginx (이슈 250 넷째 항목). 80은 인증서 발급 확인과 https로 돌려보내기만 하고,
# 443이 o2o-proxy.conf의 길 나누기를 한다. compose.server.yaml이 default.conf 자리에 이 파일을 붙인다.
#
# 확인
#   docker compose -f compose.yaml -f compose.server.yaml exec nginx nginx -t
#   curl -I http://o2o-stay.duckdns.org/      301로 https 주소를 준다
#   curl -i https://o2o-stay.duckdns.org/api/v1/properties
#
# 실패 시 출력 예시
#   [emerg] cannot load certificate "/etc/letsencrypt/live/o2o-stay.duckdns.org/fullchain.pem"
#     인증서가 없어 nginx가 뜨지 못한다. 처음 한 번은 infra/certbot/init.sh로 띄운다
#   브라우저가 자체 서명 인증서라고 경고한다
#     init.sh가 임시 인증서를 진짜로 바꾸기 전에 멈췄다. init.sh를 다시 돌린다

limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name o2o-stay.duckdns.org;

    # Let's Encrypt가 이 경로로 확인 파일을 읽는다. certbot이 같은 볼륨에 쓴다
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name o2o-stay.duckdns.org;

    # 인증서는 기동과 reload 때 읽는다. 갱신 뒤에는 reload가 필요하다(infra/certbot/renew.sh)
    ssl_certificate     /etc/letsencrypt/live/o2o-stay.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/o2o-stay.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/o2o/o2o-proxy.conf;
}
