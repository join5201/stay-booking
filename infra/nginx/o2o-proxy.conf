# 앞문의 길 나누기. PC의 default.conf와 서버의 server.conf가 server 블록 안에서 include한다.
# /api는 백엔드, 나머지는 프론트로 넘긴다. /actuator 같은 백엔드의 다른 경로는 밖으로 열지 않는다.
# 요청 제한 구역 api는 include하는 쪽이 http 단계에서 만든다(limit_req_zone).

# Docker 내장 DNS. 컨테이너를 다시 만들면 주소가 바뀌므로 10초마다 다시 묻는다.
# proxy_pass에 변수를 써야 이 resolver를 쓴다. 이름을 그대로 쓰면 기동 때 한 번만 풀고 굳는다
resolver 127.0.0.11 valid=10s ipv6=off;

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

location /api/ {
    limit_req zone=api burst=20 nodelay;
    limit_req_status 429;

    set $backend http://backend:8080;
    proxy_pass $backend;
}

location / {
    set $frontend http://frontend:3000;
    proxy_pass $frontend;
}
