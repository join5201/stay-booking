# 관측 넷을 앱 셋 옆에 띄운다: Prometheus, Loki, Alloy, Grafana (이슈 236)
#
# 왜 이 파일이 필요한가: 백엔드가 /actuator/prometheus로 업무 지표를 내지만(이슈 228) 시간 축으로
# 쌓고 볼 곳이 없다. 장애 실험에서 확정이 멈춘 구간과 그때의 오류 로그를 한 화면에서 맞추려면
# 지표 수집(Prometheus), 로그 수집(Alloy)과 보관(Loki), 화면(Grafana)이 같이 떠야 한다.
#
# 단독으로 띄우지 않는다. 루트 compose.yaml 위에 겹쳐 같은 프로젝트(o2o), 같은 망에 붙인다.
# 겹쳐 띄우면 이 파일의 상대 경로도 첫 파일(루트 compose.yaml) 기준으로 풀린다(Docker 문서
# Merge Compose files). 그래서 아래 경로는 전부 ./infra/observability/로 시작한다.
#
# 실행 예시 (저장소 루트에서)
#   docker compose --env-file backend/.env -f compose.yaml -f infra/observability/compose.yaml up --wait --build
#   docker compose --env-file backend/.env -f compose.yaml -f infra/observability/compose.yaml down
#   Grafana http://localhost:3001 (익명 보기), Prometheus http://localhost:9090
#
# 실패 시 출력 예시
#   open ./infra/observability/prometheus.yml: no such file or directory
#     이 파일을 첫 -f로 줬다. 루트 compose.yaml을 먼저 준다
#   Prometheus Targets에서 backend DOWN, 404
#     백엔드 이미지가 이슈 228 이전 것이다. --build로 다시 굽는다
#   Loki에 로그가 없음
#     docker compose ... logs alloy 에서 docker.sock 권한 오류를 본다
#   대시보드 JSON을 고쳤는데 화면이 그대로
#     Windows 바인드 마운트는 수정 시각이 안 넘어와 Grafana가 변경을 못 본다. docker compose ... restart grafana
#
# 포트는 127.0.0.1에만 연다. /actuator는 호스트로 열지 않고 Prometheus가 망 안에서 긁는다.
# 볼륨을 두지 않는다. down 하면 지표와 로그도 같이 사라진다. 실험 한 회차를 띄웠다 내리는 용도다.
# 판 번호는 2026-10-02 각 GitHub 저장소 최신 릴리스와 Docker Hub 태그로 확인했다.

services:
  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      backend:
        condition: service_healthy

  loki:
    # 이미지에 든 단일 노드 설정(/etc/loki/local-config.yaml, 파일 저장)을 그대로 쓴다
    image: grafana/loki:3.7.8

  alloy:
    image: grafana/alloy:v1.20.1
    command:
      - run
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infra/observability/config.alloy:/etc/alloy/config.alloy:ro
      # 컨테이너 목록과 로그를 Docker 엔진에서 읽는다. :ro는 소켓 파일만 읽기 전용으로 할 뿐
      # Docker API는 막지 않는다. Alloy가 뚫리면 엔진 전체를 쥔다. 로컬 실험 전용이다.
      # 서버에 올릴 때는 목록과 로그 API만 허용하는 socket proxy를 앞에 둔다(PR 238 리뷰)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # 로컬 실험용. 로그인 없이 보기 권한으로 연다. 서버에 올릴 때 다시 정한다
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/o2o-booking.json
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      # 3000은 프론트가 쓴다
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
