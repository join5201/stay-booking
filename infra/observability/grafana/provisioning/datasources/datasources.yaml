# Grafana가 켜질 때 연결 둘을 만든다 (이슈 236). uid를 고정해 대시보드 JSON이 이 이름으로 가리킨다
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
